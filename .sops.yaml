keys:
  - &operator age10gzj30y0wv32y040ymu2k2u76eldtry335zg9rk58d54algtp40sjgmrf4
  - &nix-thinkpad age1zkftm4fhsuv4gscxwqrxp5jfkhr7u63wsxdehhw0w0cd4kutzy9szzrhy9
  - &nix-letsnote1 age1ms8xr24y5yy0s2se255v8vy2s602twyjqwdlswq0jf50f3ty6cjsuczrev
  - &nix-letsnote2 age1jck0p00460dyqnvsns20pz0xg7ecu0eg2amtqlvtd88jypl47cfq23sjwv
  - &nix-optiplex1 age1w8f4ajl5mgvlncq3tplmlv0f4q8kqz9rrq3yej6g94saeu6jpelqggl23m
  - &nix-optiplex2 age1jg4c287extrgkhph23zd3gfzf09ldxqdnaraj9n7rgm28neggs6stggz9l
  - &nix-netcup-chiller age1yfrc50yrha5rjgtan6n3d5wrtn9mn6tg37x609m5vdk96pa3mf2qgvsarn
creation_rules:
  - path_regex: nix/secrets/base.yaml
    key_groups:
    - age:
      - *operator
      - *nix-thinkpad
      - *nix-letsnote1
      - *nix-letsnote2
      - *nix-optiplex1
      - *nix-optiplex2

  - path_regex: nix/secrets/sops-age.enc
    key_groups:
    - age:
      - *operator
      - *nix-letsnote1
      - *nix-optiplex1
      - *nix-optiplex2

  - path_regex: nix/secrets/zigbee2mqtt.yaml
    key_groups:
    - age:
      - *operator
      - *nix-optiplex2

  - path_regex: nix/secrets/mosquitto.yaml
    key_groups:
    - age:
      - *operator
      - *nix-optiplex2

  - path_regex: nix/secrets/z2m-devices.enc
    key_groups:
    - age:
      - *operator
      - *nix-optiplex2

  - path_regex: nix/secrets/zed.yaml
    key_groups:
    - age:
      - *operator
      - *nix-optiplex1

  - path_regex: nix/secrets/tailscale.yaml
    key_groups:
    - age:
      - *operator
      - *nix-netcup-chiller

  - path_regex: cluster/.*\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
    - age:
      - *operator