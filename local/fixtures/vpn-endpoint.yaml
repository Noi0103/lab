# WireGuard server standing in for Mullvad: gluetun connects to it as a
# `custom` provider (local/flux/patches/apps.yaml) and it NATs the tunnel out
# through the pod network. Keys are generated by local/cluster.sh into
# local/.state/vpn, so prod's Mullvad key is never used locally.
# `local/cluster.sh verify` takes wg0 down here to test gluetun's kill switch.
apiVersion: v1
kind: Namespace
metadata:
  name: local-fixtures
---
# gluetun's namespace, so the qbittorrent-init ConfigMap and the gluetun
# Secret can be created before Flux's apps stage creates it.
apiVersion: v1
kind: Namespace
metadata:
  name: gluetun
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpn-endpoint
  namespace: local-fixtures
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vpn-endpoint
  template:
    metadata:
      labels:
        app: vpn-endpoint
    spec:
      containers:
        - name: wireguard
          image: wireguard
          # Bypasses the image's s6 entrypoint; only its wg and iptables are used.
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euxo pipefail
              sysctl -qw net.ipv4.ip_forward=1
              # The pod's netns outlives container restarts.
              ip link del wg0 2>/dev/null || true
              iptables -t nat -F POSTROUTING
              ip link add wg0 type wireguard
              # This image's wg cannot fopen() files (EACCES even as root, also
              # /dev/stdin redirected from a file); a pipe works.
              cat /keys/server_private_key | wg set wg0 listen-port 51820 private-key /dev/stdin \
                peer "$(cat /keys/client_public_key)" allowed-ips 10.64.0.2/32
              ip address add 10.64.0.1/24 dev wg0
              ip link set wg0 up
              iptables -t nat -A POSTROUTING -s 10.64.0.0/24 -o eth0 -j MASQUERADE
              trap 'exit 0' TERM
              sleep infinity &
              wait
          securityContext:
            privileged: true
          readinessProbe:
            exec:
              command: ["wg", "show", "wg0"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
      volumes:
        - name: keys
          secret:
            secretName: vpn-endpoint
---
apiVersion: v1
kind: Service
metadata:
  name: vpn-endpoint
  namespace: local-fixtures
spec:
  # Fixed, because gluetun only takes an IP as WireGuard endpoint
  # (WIREGUARD_ENDPOINT_IP in local/flux/patches/apps.yaml).
  clusterIP: 10.43.0.51
  selector:
    app: vpn-endpoint
  ports:
    - name: wireguard
      port: 51820
      protocol: UDP
