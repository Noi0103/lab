---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  patches:
    # A second peer with prod's Mullvad WireGuard key would break prod's tunnel.
    - target:
        kind: Deployment
        name: gluetun
      patch: |-
        - op: replace
          path: /spec/replicas
          value: 0
    - patch: |-
        $patch: delete
        apiVersion: v1
        kind: Secret
        metadata:
          name: gluetun
          namespace: gluetun
