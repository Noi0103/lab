---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  patches:
    # With prod's OAuth client the operator would join the real tailnet.
    - patch: |-
        $patch: delete
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: tailscale-operator
          namespace: tailscale
    - patch: |-
        $patch: delete
        apiVersion: v1
        kind: Secret
        metadata:
          name: operator-oauth
          namespace: tailscale
