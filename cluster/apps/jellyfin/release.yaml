---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: jellyfin
      version: v3.2.0
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: jellyfin
  releaseName: jellyfin
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deploymentStrategy:
      type: Recreate
    replicaCount: 1
    image:
      # The chart defaults to its appVersion (10.11.8 in 3.2.0), which Renovate
      # cannot see. 10.11.11 is the last 10.11 release; 12.x needs a manual
      # migration (#41) and Renovate does not offer it from a three-part tag.
      # renovate: datasource=docker depName=docker.io/jellyfin/jellyfin
      tag: "10.11.11"
      pullPolicy: IfNotPresent
    ingress:
      enabled: true
      className: 'traefik'
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure,public
      hosts:
        - host: jellyfin.${EXTERNAL_DOMAIN}
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: jellyfin-tls
          hosts:
            - jellyfin.${EXTERNAL_DOMAIN}
    persistence:
      config:
        existingClaim: jellyfin-config
      media:
        existingClaim: jellyfin-media
      cache:
        enabled: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        labels:
          release: observability
    nodeSelector:
      kubernetes.io/hostname: nix-optiplex2
