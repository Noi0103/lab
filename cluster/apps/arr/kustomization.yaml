---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secret.yaml
  - ./sonarr
  - ./prowlarr
  - ./bazarr
  - ./arr-config
configMapGenerator:
  # Shared by the apps' wait-for-postgres init containers.
  - name: wait-for-postgres
    namespace: arr
    files:
      - wait-for-postgres.sh
    options:
      annotations:
        # Flux would otherwise substitute the shell's $variables.
        kustomize.toolkit.fluxcd.io/substitute: disabled
