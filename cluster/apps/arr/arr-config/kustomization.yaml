---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cronjob.yaml
configMapGenerator:
  - name: arr-config
    namespace: arr
    files:
      - arr-config.sh
    options:
      annotations:
        # Flux would otherwise substitute the shell's $variables.
        kustomize.toolkit.fluxcd.io/substitute: disabled
