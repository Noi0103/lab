---
# Configarr wires Prowlarr -> Sonarr and Sonarr's root folder (config.yml);
# the host-config init container sets what Configarr cannot (UI login,
# certificate validation) and creates the root folder on the share. Every 15
# minutes, so it recovers from apps that were not ready yet; both steps only
# write on change.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arr-config
  namespace: arr
  labels:
    app.kubernetes.io/name: arr-config
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: arr-config
        spec:
          enableServiceLinks: false
          restartPolicy: Never
          initContainers:
            - name: host-config
              # Reused for its bash, curl and jq (linuxserver base image); already
              # pulled for sonarr. Bypasses the s6 entrypoint.
              image: ghcr.io/linuxserver/sonarr:4.0.20.3014-ls327
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/scripts/host-config.sh"]
              securityContext:
                runAsUser: 2000
                runAsGroup: 2000
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              env:
                - name: EXTERNAL_DOMAIN
                  value: ${EXTERNAL_DOMAIN}
                # enabled | disabledForLocalAddresses | disabled (local patch).
                - name: CERT_VALIDATION
                  value: enabled
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arr
                      key: sonarr_api_key
                - name: PROWLARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arr
                      key: prowlarr_api_key
                - name: UI_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: arr
                      key: arr_ui_username
                - name: UI_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: arr
                      key: arr_ui_password
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: media
                  mountPath: /media
          containers:
            - name: configarr
              image: ghcr.io/raydak-labs/configarr:1.34.1
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              env:
                # Fail the Job (and keep it visible) instead of logging and exiting 0.
                - name: STOP_ON_ERROR
                  value: "true"
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arr
                      key: sonarr_api_key
                - name: PROWLARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arr
                      key: prowlarr_api_key
                - name: QBITTORRENT_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: arr
                      key: qbittorrent_username
                - name: QBITTORRENT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: arr
                      key: qbittorrent_password
              volumeMounts:
                - name: config
                  mountPath: /app/config
                  readOnly: true
                # Configarr always clones the TRaSH-Guides and Recyclarr template
                # repos (no switch to turn it off), so it needs git egress and a
                # writable /app/repos even though no profiles are used.
                - name: repos
                  mountPath: /app/repos
          volumes:
            - name: scripts
              configMap:
                name: arr-host-config
            - name: config
              configMap:
                name: configarr
            - name: repos
              emptyDir: {}
            - name: media
              nfs:
                server: ${NFS_HOST}
                path: /tank/media
