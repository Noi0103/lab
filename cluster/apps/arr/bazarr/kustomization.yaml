---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - ingress.yaml
  - pvc.yaml
  - service.yaml
configMapGenerator:
  - name: bazarr-seed-config
    namespace: arr
    files:
      - seed-config.sh
    options:
      annotations:
        # Flux would otherwise substitute the shell's $variables.
        kustomize.toolkit.fluxcd.io/substitute: disabled
